<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>t3-worker</title>
    <script src="../base1/cockpit.js"></script>
    <script src="app.js" defer></script>
    <style>
        :root {
            --bg: #f5f5f5; --card: #fff; --text: #151515; --muted: #6a6e73; --line: #d2d2d2;
            --ok: #3e8635; --bad: #c9190b; --warn: #b7791f; --bar: #e0e0e0; --accent: #0066cc;
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151515; --card: #212427; --text: #e0e0e0; --muted: #a2a5a8; --line: #3c3f42;
                --ok: #5ba352; --bad: #f0561d; --warn: #f4c145; --bar: #3c3f42; --accent: #73bcf7;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px; background: var(--bg); color: var(--text);
            font: 14px/1.5 "Red Hat Text", "Open Sans", system-ui, sans-serif;
        }
        header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 500; margin: 0; }
        h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
        .badge { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; }
        .badge.ok { background: var(--ok); }
        .badge.bad { background: var(--bad); }
        .badge.stale { background: var(--warn); color: #151515; }
        .meta { color: var(--muted); font-size: 13px; }
        .spacer { flex: 1; }
        button {
            font: inherit; padding: 6px 14px; border-radius: 4px; cursor: pointer;
            border: 1px solid var(--accent); background: transparent; color: var(--accent);
        }
        button:disabled { opacity: .5; cursor: default; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
        .card.wide { grid-column: 1 / -1; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
        dt { color: var(--muted); }
        dd { margin: 0; font-variant-numeric: tabular-nums; }
        ul { margin: 0; padding: 0; list-style: none; }
        li { padding: 6px 0; border-top: 1px solid var(--line); }
        li:first-child { border-top: 0; padding-top: 0; }
        .svc { display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
        .dot.ok { background: var(--ok); }
        .dot.bad { background: var(--bad); }
        .svc .state { margin-left: auto; color: var(--muted); font-size: 13px; }
        .disk-head { display: flex; justify-content: space-between; gap: 8px; }
        .disk-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
        .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .bar > div { height: 100%; background: var(--ok); }
        .bar > div.warn { background: var(--warn); }
        .bar > div.bad { background: var(--bad); }
        .problem { color: var(--bad); }
        .empty { color: var(--muted); }
        code { font-family: "Red Hat Mono", ui-monospace, monospace; font-size: 13px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>t3-worker</h1>
        <span id="badge" class="badge" hidden></span>
        <span id="generated" class="meta"></span>
        <span class="spacer"></span>
        <button id="refresh" type="button">Jetzt prüfen</button>
    </header>

    <p id="nodata" class="card" hidden>Noch kein Status vorhanden. Die Gesundheitsprüfung läuft alle 5 Minuten.</p>

    <main id="main" class="grid" hidden>
        <section class="card wide" id="attention-card" hidden>
            <h2>Braucht Aufmerksamkeit</h2>
            <ul id="attention"></ul>
        </section>

        <section class="card">
            <h2>System</h2>
            <dl id="system"></dl>
        </section>

        <section class="card">
            <h2>Dienste</h2>
            <ul id="services"></ul>
        </section>

        <section class="card">
            <h2>Speicher</h2>
            <ul id="disks"></ul>
        </section>

        <section class="card">
            <h2>T7 und Spiegel</h2>
            <dl id="t7"></dl>
        </section>

        <section class="card" id="repairs-card" hidden>
            <h2>Letzte Reparaturen</h2>
            <ul id="repairs"></ul>
        </section>
    </main>
</body>
</html>
