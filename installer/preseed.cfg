#_preseed_V1
# Debian 13 "trixie" unattended install for the t3-worker laptop.
#
# make-stick.sh renders this file into the ISO and fills in the password hash
# placeholder and the optional Wi-Fi block. The repository copy never
# contains secrets.
#
# Safety: partman/early_command runs installer/select-disk.sh, which picks the
# internal SSD by model and aborts the install if the hardware does not match.
# Only that SSD is partitioned. The internal HDD and any USB disk stay untouched.

### Localisation
d-i debian-installer/language string de
d-i debian-installer/country string DE
d-i debian-installer/locale string de_DE.UTF-8
d-i localechooser/supported-locales multiselect de_DE.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i keyboard-configuration/layoutcode string de

### Network
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 15
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string t3-worker
d-i netcfg/get_domain string
d-i netcfg/hostname string t3-worker
d-i hw-detect/load_firmware boolean true
#@@WIFI@@

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: no root password (root login disabled), user leander with sudo
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string leander
d-i passwd/username string leander
d-i passwd/user-password-crypted password @@PASSWORD_HASH@@
d-i passwd/user-default-groups string audio cdrom video plugdev users sudo

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Partitioning: SSD only (selected by select-disk.sh), GPT, EFI + Btrfs root, no swap
d-i partman/early_command string sh /cdrom/t3-worker/select-disk.sh
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/expert_recipe string \
    t3worker :: \
        538 538 1075 free \
            $iflabel{ gpt } $reusemethod{ } \
            method{ efi } format{ } \
        . \
        8192 10000 -1 btrfs \
            $primary{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ btrfs } \
            label{ t3root } \
            mountpoint{ / } \
        .
d-i partman-auto/choose_recipe select t3worker
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid

### Base system and apt
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Packages: minimal, SSH server + standard utilities, mDNS so t3-worker.local resolves
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates git avahi-daemon libnss-mdns btrfs-progs zram-tools
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Boot loader (the target disk is set by select-disk.sh)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Finish: copy the setup repo + SSH key into the target, then power off
# (power off instead of reboot, so the stick is not booted again by accident)
d-i preseed/late_command string sh /cdrom/t3-worker/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/poweroff boolean true
